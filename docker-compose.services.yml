version: "3.8"

services:
  user-service:
    build: ./services/user-service
    ports:
      - "5001:5001"
    environment:
      - PORT=5001
      - SECRET_KEY=my-shared-secret-key-change-me
    volumes:
      - ./services/user-service/data:/app/data

  itinerary-service:
    build: ./services/itinerary-service
    ports:
      - "5002:5002"
    environment:
      - PORT=5002
      - SECRET_KEY=my-shared-secret-key-change-me
    volumes:
      - ./services/itinerary-service/data:/app/data

  recommendation-service:
    build: ./services/recommendation-service
    ports:
      - "5003:5003"
    environment:
      - PORT=5003
      - SECRET_KEY=my-shared-secret-key-change-me
      - USER_SERVICE_URL=http://user-service:5001
    volumes:
      - ./services/recommendation-service/data:/app/data
    depends_on:
      - user-service

  gateway:
    build: ./services/gateway
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - USER_SERVICE_URL=http://user-service:5001
      - ITINERARY_SERVICE_URL=http://itinerary-service:5002
      - RECOMMENDATION_SERVICE_URL=http://recommendation-service:5003
    depends_on:
      - user-service
      - itinerary-service
      - recommendation-service
